name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          DATABASE_URL: postgresql://luxe:luxe@localhost:5432/luxe_maxima
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
